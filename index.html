            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            overflow: hidden;
            padding: 20px;
        }
        .notebook {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease;
            position: relative;
            border: 1px solid #e8e4dc;

        }

            flowers.push({
                n: name,
                m: `따스한 햇살 속에서 피어난 ${name}의 꽃말이 오늘 하루 당신의 마음에 고요한 위로와 기쁨을 전해줍니다.`,

            });

        let currentDayOfYear = getDayOfYear(new Date());

        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay) - 1;
        }

        function updateDisplay() {
            const flower = flowers[currentDayOfYear % flowers.length];
            
            const dateObj = new Date(new Date().getFullYear(), 0, 1);
            dateObj.setDate(dateObj.getDate() + currentDayOfYear);
            const month = dateObj.getMonth() + 1;
            const day = dateObj.getDate();

            document.getElementById('dateBadge').innerText = `${month}월 ${day}일`;
            document.getElementById('flowerName').innerText = flower.n;
            document.getElementById('flowerMeaning').innerText = flower.m;
            
            const imgElement = document.getElementById('flowerImg');
            imgElement.style.opacity = '0';
            imgElement.src = flower.img;
            imgElement.onload = () => {
                imgElement.style.opacity = '1';
            };
        }

        function nextDay() {
            currentDayOfYear = (currentDayOfYear + 1) % flowers.length;
            updateDisplay();
        }

                e.preventDefault();
                nextDay();
            }
        });
